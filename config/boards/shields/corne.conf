# --- STRØMSPARING OG BATTERI ---
# Aktiver dyp dvale (deep sleep) etter inaktivitet (anbefalt for trådløse tastaturer)
CONFIG_ZMK_SLEEP=y

# Tid før dyp dvale i millisekunder (3 600 000 ms = 60 minutter / 1 time)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=360000



# --- OLED-SKJERMER (Kun dersom du har montert skjermer) ---
# CONFIG_ZMK_DISPLAY=y

# --- RGB-BYS (Kun dersom du har montert RGB LED-lys) ---
